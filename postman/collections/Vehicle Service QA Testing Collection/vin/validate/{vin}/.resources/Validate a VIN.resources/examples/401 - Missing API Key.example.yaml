$kind: http-example
request:
  url: "{{baseUrl}}/vin/validate/:vin"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: vin
      value: 1G4HC5EM7BU118847
      description: The Vehicle Identifcation Number to be validated.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You must provide a valid API key to access this endpoint."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 3000
