$kind: http-example
request:
  url: "{{baseUrl}}/vin/validate/:vin"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: vin
      value: 1G4HC5EM7BU1188
      description: The Vehicle Identifcation Number to be validated.
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The provided VIN - {{$pathSegments '2'}} - is INVALID. It must be 17 characters."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 4000
